<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Heart ❤️</title>
  <meta name="description" content="A beautiful animated love heart filled with 'I love you' in 20+ languages." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060208;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas { display: block; max-width: 100vw; max-height: 100vh; }
    #glow {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 55% 45% at 50% 50%, rgba(150,10,30,0.18) 0%, transparent 70%);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.04); }
    }
  </style>
</head>
<body>
<div id="glow"></div>
<canvas id="c"></canvas>
<script>
const SC=21,OY_OFFSET=20,DURATION=10,TICK=16,ANIM=42,LIFT=34,GAP=7;
const SIZES=[9,10,11,12],FONT="Arial",BG="#060208";
const BGC=[6/255,2/255,8/255],FLASH=[1.0,0.78,0.78];
const PHRASES=["I love you","Seni seviyorum","Te amo","Je t'aime","Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю","사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ","Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię","ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тебе кохаю"];
function mkRng(seed){let s=seed>>>0;return{random(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},uniform(a,b){return a+this.random()*(b-a)},choice(arr){return arr[Math.floor(this.random()*arr.length)]},shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(this.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}}}
const rng=mkRng(11);
const clamp=v=>Math.max(0,Math.min(1,v));
const mix=(a,b,k)=>a.map((p,i)=>p+(b[i]-p)*k);
const dim=(c,k)=>c.map(v=>v*k);
const hx=c=>{const[r,g,b]=c.map(v=>Math.round(clamp(v)*255));return`rgb(${r},${g},${b})`};
function heartPt(a){const x=16*Math.pow(Math.sin(a),3);const y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);return[x*SC,y*SC+OY_OFFSET]}
const POLY=Array.from({length:720},(_,i)=>heartPt(2*Math.PI*i/720));
const EDGES=POLY.map((p,i)=>[p,POLY[(i+1)%720]]);
const YMAX=Math.max(...POLY.map(p=>p[1]));
const YMIN=Math.min(...POLY.map(p=>p[1]));
const CY=(YMAX+YMIN)/2;
function spans(y){const xs=[];for(const[[x1,y1],[x2,y2]]of EDGES){if((y1<=y&&y<y2)||(y2<=y&&y<y1))xs.push(x1+(y-y1)*(x2-x1)/(y2-y1))}xs.sort((a,b)=>a-b);const out=[];for(let i=0;i<xs.length-1;i+=2)out.push([xs[i],xs[i+1]]);return out}
function intersect(A,B){const out=[];for(const a of A)for(const b of B){const lo=Math.max(a[0],b[0]),hi=Math.min(a[1],b[1]);if(hi-lo>14)out.push([lo,hi])}return out}
function mathDist(x,y){return Math.hypot(x/(16*SC),(y-CY)/(14.5*SC))}
const mc=document.createElement("canvas").getContext("2d");
function measureText(text,size){mc.font=`bold ${size}px ${FONT}`;return mc.measureText(text).width}
function lineH(size){return size*1.35}
function*phraseGen(){while(true){const o=[...PHRASES];rng.shuffle(o);yield*o}}
function build(){const cycle=phraseGen();const maxRowH=Math.max(...SIZES.map(s=>lineH(s)))+4;const half=maxRowH/2;const placed=[];let y=YMAX-half;while(y>YMIN+half){const row=intersect(spans(y+half),spans(y-half));for(let[lo,hi]of row){lo+=4;hi-=4;let cur=lo+rng.uniform(0,8);const line=[];while(true){let fit=null;for(let a=0;a<10;a++){const text=cycle.next().value;const size=rng.choice(SIZES);const w=measureText(text,size);if(cur+w<=hi){fit={text,size,w};break}}if(!fit)break;const{text,size,w}=fit;line.push({x:cur+w/2,text,size,w});cur+=w+GAP}if(!line.length)continue;if(line.length>1){const left=hi-(line[line.length-1].x+line[line.length-1].w/2);line.forEach((it,i)=>{it.x+=left*i/(line.length-1)})}else{line[0].x=(lo+hi)/2}line.forEach((it,i)=>{const edge=i===0||i===line.length-1;placed.push({...it,y,edge})})}y-=maxRowH}const wine=[0.58,0.0,0.09],crimson=[0.90,0.05,0.14],blood=[0.98,0.10,0.16];for(const p of placed){const rad=Math.min(1.0,mathDist(p.x,p.y));let base=mix(wine,crimson,0.25+0.75*rad);base=mix(base,blood,rng.uniform(0,0.35)+(p.edge?0.3:0));p.color=base.map(v=>Math.min(1,v));p.rad=rad}const edges=placed.filter(p=>p.edge).sort((a,b)=>(Math.atan2(a.x,a.y-CY)%(2*Math.PI))-(Math.atan2(b.x,b.y-CY)%(2*Math.PI)));const inner=placed.filter(p=>!p.edge).sort((a,b)=>(-a.rad+rng.uniform(0,0.08))-(-b.rad+rng.uniform(0,0.08)));return[...edges,...inner]}
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const W=800,H=800;
const dpr=window.devicePixelRatio||1;
canvas.width=W*dpr;canvas.height=H*dpr;
canvas.style.width=W+"px";canvas.style.height=H+"px";
ctx.scale(dpr,dpr);
const OX=W/2,OYC=H/2+10;
const ORDER=build();
let items=0;
const RATE=ORDER.length/(DURATION*1000/TICK);
let acc=0,spawning=true;
const active=[],settled=[],mainItems=[];
function toCanvas(x,y){return[OX+x,OYC-y]}
function spawn(p){active.push({...p,f:0,dx:rng.uniform(-10,10)})}
function mathSin(v){return Math.sin(Math.PI*v)}
function drawWord(x,y,text,size,fill,alpha){ctx.save();if(alpha!==undefined)ctx.globalAlpha=alpha;ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=fill;ctx.fillText(text,x,y);ctx.restore()}
function step(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);for(const s of settled){const[cx,cy]=toCanvas(s.x,s.y);drawWord(cx+1,cy+2,s.text,s.size,hx(mix(BGC,dim(s.color,0.3),1)));drawWord(cx,cy,s.text,s.size+1,hx(mix(BGC,dim(s.color,0.2),0.6)),0.6);const fc=shimmerOn.has(s)?mix(s.color,FLASH,0.6):s.color;drawWord(cx,cy,s.text,s.size,hx(fc))}if(spawning){acc+=RATE;while(acc>=1&&items<ORDER.length){acc-=1;spawn(ORDER[items++])}if(items>=ORDER.length)spawning=false}const still=[];for(const p of active){p.f++;const u=clamp(p.f/ANIM);const e=1-Math.pow(1-u,3);const c=p.color;const[cx,cy]=toCanvas(p.x,p.y);const hover=(1-e)*LIFT;const px=cx+p.dx*(1-e);const py=cy-hover;drawWord(px+1,py+2,p.text,p.size,hx(mix(BGC,dim(c,0.30),e)));drawWord(px,py,p.text,p.size+1,hx(mix(BGC,dim(c,0.20),e*e)),e*e);const flash=0.75*mathSin(clamp((u-0.55)/0.45));const col=mix(mix(BGC,c,Math.pow(e,1.5)),FLASH,flash);drawWord(px,py,p.text,p.size,hx(col));if(u>=1){settled.push(p);mainItems.push(p)}else{still.push(p)}}active.length=0;active.push(...still);if(!spawning&&active.length===0&&mainItems.length>0){doShimmer();return}setTimeout(step,TICK)}
const shimmerOn=new Set();
function doShimmer(){const t=settled[Math.floor(rng.random()*settled.length)];shimmerOn.add(t);redrawAll();setTimeout(()=>{shimmerOn.delete(t);redrawAll();setTimeout(doShimmer,140)},260)}
function redrawAll(){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);for(const s of settled){const[cx,cy]=toCanvas(s.x,s.y);drawWord(cx+1,cy+2,s.text,s.size,hx(mix(BGC,dim(s.color,0.3),1)));drawWord(cx,cy,s.text,s.size+1,hx(mix(BGC,dim(s.color,0.2),0.6)),0.6);const fc=shimmerOn.has(s)?mix(s.color,FLASH,0.6):s.color;drawWord(cx,cy,s.text,s.size,hx(fc))}}
setTimeout(step,200);
</script>
</body>
</html>
